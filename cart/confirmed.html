<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Confirmed</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="confirmed.css">
</head>

<body>


    </header>


    <!-- MAIN CONTENT -->
    <main class="confirmation-page">

        <section class="confirmation-content">

            <!-- SUCCESS ICON -->
            <div class="success-icon">
                <span>✓</span>
            </div>


            <!-- TITLE -->
            <h1>
                Order Confirmed!
            </h1>


            <!-- DESCRIPTION -->
            <p class="message">
                Your payment was successful.
                Chef Amaka has been notified and is
                preparing your order with love.
            </p>


            <!-- ORDER INFORMATION CARD -->
            <div class="order-card">

                <div class="order-number-label">
                    ORDER NUMBER
                </div>

                <!-- DYNAMIC ORDER NUMBER -->
                <div
                    class="order-number"
                    id="orderNumber"
                >
                    Loading...
                </div>


                <div class="order-details">

                    <!-- DELIVERY TIME -->
                    <div class="detail-row">

                        <span>
                            Estimated delivery
                        </span>

                        <strong id="estimatedDelivery">
                            Loading...
                        </strong>

                    </div>


                    <!-- DELIVERY ADDRESS -->
                    <div class="detail-row">

                        <span>
                            Delivery address
                        </span>

                        <strong id="confirmedAddress">
                            Loading...
                        </strong>

                    </div>


                    <!-- PAYMENT METHOD -->
                    <div class="detail-row">

                        <span>
                            Payment method
                        </span>

                        <strong id="confirmedPaymentMethod">
                            Loading...
                        </strong>

                    </div>


                    <!-- AMOUNT PAID -->
                    <div class="detail-row">

                        <span>
                            Amount paid
                        </span>

                        <strong id="confirmedAmount">
                            ₦0
                        </strong>

                    </div>

                </div>

            </div>


            <!-- BUTTONS -->
            <div class="buttons">

                <a href="Chefcooking.html">
                    <button
                        class="track-btn"
                        id="trackOrderBtn"
                        type="button"
                    >
                        Track My Order
                    </button>
                </a>


                <a href="../index.html">
                    <button
                        class="home-btn"
                        id="homeBtn"
                        type="button"
                    >
                        Back to Home
                    </button>
                </a>

            </div>

        </section>

    </main>


    <script src="confirmed.js"></script>

</body>
</html>

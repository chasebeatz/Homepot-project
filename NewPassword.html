<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomePot - Forgot Password</title>
    <link rel="stylesheet" href="password/password.css">
</head>

<body class="newpassword" >

    <div class="container">

        <!-- LEFT IMAGE SECTION -->
        <section class="left-section">

            <div class="food-image">
                <img src="Food recipe.jpeg" alt="Home cooked food">
            </div>

            <div class="overlay"></div>

            <!-- Small Logo -->
            <div class="logo">
                🍲
            </div>

            <!-- Left Text -->
            <div class="left-content">

                <h1>
                    "Real kitchens. Real chefs.
                    <span>Real flavor."</span>
                </h1>

                <p>
                    Connecting you to talented home cooks and private chefs
                    in your neighbourhood. Order authentic, home-cooked
                    meals delivered to your door.
                </p>

                <div class="stats">

                    <div class="stat">
                        <h3>500+</h3>
                        <span>Home Chefs</span>
                    </div>

                    <div class="stat">
                        <h3>12k+</h3>
                        <span>Happy Customers</span>
                    </div>

                    <div class="stat">
                        <h3>4.8★</h3>
                        <span>Avg Rating</span>
                    </div>

                </div>

            </div>

        </section>

        
        <!-- RIGHT SIDE -->
        <div class="right-side">

            <div class="password-box">

                <div class="success-icon">✓</div>

                <h1>Create New Password</h1>

                <form>

                    <label for="password">New Password</label>

                    <!--
                    Password requirements are enforced here:
                    - minlength="8"
                    - at least one uppercase letter
                    - at least one number OR symbol
                    -->
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter strong password"
                        minlength="8"
                        pattern="(?=.*[A-Z])(?=.*[0-9!@#$%^&*]).{8,}"
                        title="Password must be at least 8 characters long, contain one uppercase letter, and contain one number or symbol."
                        required
                    >


                    <label for="confirm-password">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Re-enter your new password"
                        required
                    >


                    <button type="submit">
                        Update Password
                    </button>

                </form>

            </div>

        </div>

    </div>

</body>
</html>

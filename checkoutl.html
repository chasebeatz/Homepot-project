<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomePot - Ready to Checkout</title>

    <link rel="stylesheet" href="checkout.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="logo">
            <div class="logo-icon">▰</div>
            <span>HomePot</span>
        </div>

        <!-- Search -->
        <div class="search-box">
            <span class="search-icon">⌕</span>
            <input
                type="text"
                placeholder="Search for foods, chefs, or cuisines..."
            >
        </div>

        <!-- Right side of header -->
        <div class="header-right">

            <div class="location">
                <span>⌖</span>
                <span>Yaba, Lagos</span>
                <span>⌄</span>
            </div>

            <div class="cart">
                🛒
                <span class="cart-number">3</span>
            </div>

            <div class="profile">
                <img src="https://i.pravatar.cc/100?img=47" alt="Profile">
            </div>

        </div>
    </header>


    <!-- Main content -->
    <main class="main-content">

        <!-- Background food image on the left -->
        <div class="food-background food-left">
            <img
                src="https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=500&q=80"
                alt="Food"
            >
        </div>

        <!-- Background food image on the right -->
        <div class="food-background food-right">
            <img
                src="https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=500&q=80"
                alt="Food"
            >
        </div>


        <!-- Checkout Card -->
        <section class="checkout-card">

            <h1>Ready to checkout?</h1>

            <p class="checkout-description">
                You have <strong>3 items</strong> in your cart from
                <strong>Chef Amaka</strong> totaling
                <strong>₦9,100.</strong>
                Want to add more, or proceed to checkout?
            </p>


            <!-- Cart item -->
            <div class="cart-item">

                <img
                    src="https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=100&q=80"
                    alt="Banga Soup"
                >

                <div class="item-text">
                    <strong>Banga Soup just added</strong>
                    <span>+ 2 more items from Chef Amaka</span>
                </div>

            </div>


            <!-- Proceed button -->
            <button class="proceed-button">
                Proceed to Cart
            </button>


            <!-- Keep browsing button -->
            <button class="browse-button">
                Keep Browsing
            </button>

        </section>

    </main>

    <script src="account-status.js"></script>
</body>
</html>

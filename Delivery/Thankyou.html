<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You</title>

    <link rel="stylesheet" href="Thankyou.css">
</head>

<body>

    <main class="thank-you-page">

        <!-- Small chef/food icon -->
        <div class="small-icon">
            <span>🍲</span>
        </div>

        <!-- Main thank-you icon -->
        <div class="main-icon">
            <span>🍲</span>
        </div>

        <!-- Heading -->
        <h1>Thank You, Ada!</h1>

        <!-- Description -->
        <p class="message">
            Your feedback helps Chef Amaka and our entire community of home chefs
            grow. We hope every bite of that Banga Soup was worth the wait.
        </p>

        <!-- Review information -->
        <section class="review-card">
            <p class="review-title">YOUR REVIEW WAS SHARED WITH</p>

            <h2>Chef Amaka Osei</h2>

            <div class="stars">
                ★ ★ ★ ★ ★
            </div>
        </section>

        <!-- Buttons -->
        <div class="buttons">

            <button class="order-again" id="orderAgain">
                Order Again from Chef Amaka
            </button>

            <a href="../index.html">
                <button class="back-home" id="backHome">
                    Back to Home
                </button>
            </a>

        </div>

    </main>

    <script src="Thankyou.js"></script>

</body>
</html>

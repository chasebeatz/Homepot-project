<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Delivered</title>

    <link rel="stylesheet" href="Delivered.css">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>

<body>


    <!-- MAIN CONTENT -->
    <main class="main-content">

        <section class="delivery-container">

            <!-- Celebration Icon -->
            <div class="celebration">
                🎉
            </div>

            <!-- Heading -->
            <h1>Order Delivered!</h1>

            <!-- Description -->
            <p class="description">
                Your food from Chef Amaka has arrived. Emeka delivered your
                order in just <strong>23 minutes.</strong> Enjoy your meal!
            </p>


            <!-- ORDER INFORMATION -->
            <div class="order-card">

                <div class="info-row">
                    <span>Order #</span>
                    <strong>HP-20241025</strong>
                </div>

                <div class="info-row">
                    <span>Delivered at</span>
                    <strong>2:47 PM</strong>
                </div>

                <div class="info-row">
                    <span>Delivery time</span>
                    <strong>23 minutes</strong>
                </div>

                <div class="info-row">
                    <span>Amount paid</span>
                    <strong>₦9,800</strong>
                </div>

            </div>


            <!-- BUTTONS -->
            <div class="buttons">

                <a href="Experience.html">
                     <button class="rate-btn" id="rateButton">
                    Rate Your Experience
                </button>
                </a>

                <button class="wrong-btn" id="wrongButton">
                    Something Wrong?
                </button>

            </div>

        </section>

    </main>


    <script src="Delivered.js"></script>

</body>
</html>
